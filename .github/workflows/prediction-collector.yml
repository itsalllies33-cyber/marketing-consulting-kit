name: Prediction data collector

# Free BSC RPCs keep only ~1 hour of logs, so this runs every 30 minutes with a
# 90-minute lookback and appends to pancake-prediction/data/. Schedules only fire
# from the default branch; use "Run workflow" to trigger by hand.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python pancake-prediction/collector.py
      - name: Commit appended data
        run: |
          git config user.name "prediction-collector"
          git config user.email "prediction-collector@users.noreply.github.com"
          git add pancake-prediction/data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: collector run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
